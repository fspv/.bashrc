[preview]
revision_command = [
  "util", "exec", "--", "sh", "-c", '''
timeout 120 jjui-tools pr-prefetch "$1" </dev/null >/dev/null 2>&1 &
exec jjui-tools pr-preview "$1"
''', "jjui-pr-preview", "$change_id",
]
evolog_command = ["evolog", "--color", "always", "-r", "$commit_id", "-p", "-n", "1"]
oplog_command = ["op", "show", "$operation_id", "--color", "always"]
file_command = ["diff", "--color", "always", "-r", "$change_id", "$file"]
position = "auto"
show_at_start = true
width_percentage = 50.0
width_increment_percentage = 5.0

[[actions]]
name = "fetch-and-rebase"
lua = '''
jj_async("git", "fetch", "--tracked")
jj_async("rebase", "-b", "@", "--skip-emptied", "-o", "main")
revisions.refresh()
'''

[[bindings]]
action = "fetch-and-rebase"
key = "F"
scope = "revisions"
desc = "fetch tracked + rebase onto main"

[[actions]]
name = "pr-stack"
lua = '''
local number = input({ title = "PR number", prompt = "#" })
if not number or number == "" then return end
local branch, err = jj("util", "exec", "--", "jjui-tools", "pr-head", number)
if not branch then
  flash({ text = "PR #" .. number .. " lookup failed: " .. (err or "?"), error = true })
  return
end
branch = branch:gsub("%s+$", "")
jj_async("git", "fetch", "--remote", "origin", "--bookmark", "exact:" .. branch)
revset.set("trunk()..(" .. branch .. "@origin | @)")
revisions.refresh()
flash("PR #" .. number .. ": " .. branch)
'''

[[bindings]]
action = "pr-stack"
seq = ["g", "p"]
scope = "revisions"
desc = "fetch a PR and show its stack"

[[actions]]
name = "edit-file"
lua = '''exec_shell('$EDITOR -- "$file"')'''

[[bindings]]
action = "edit-file"
key = "e"
scope = "revisions.details"
desc = "open file in editor"

[[actions]]
name = "show-change-copies"
lua = '''
local change_id = jj("log", "--no-graph", "-r", context.commit_id(), "-T", "change_id")
revset.set("change_id(" .. change_id .. ")")
'''

[[bindings]]
action = "show-change-copies"
seq = ["g", "d"]
scope = "revisions"
desc = "show all copies of this change"

[[actions]]
name = "move-change-bookmarks-here"
lua = '''
local kept_commit = context.commit_id()
local change_id = jj("log", "--no-graph", "-r", kept_commit, "-T", "change_id")
jj_async("bookmark", "move", "--from", "change_id(" .. change_id .. ")", "--to", kept_commit, "--allow-backwards")
revisions.refresh()
flash("bookmarks of " .. change_id .. " moved to " .. kept_commit)
'''

[[bindings]]
action = "move-change-bookmarks-here"
seq = ["g", "b"]
scope = "revisions"
desc = "move this change's bookmarks to the selected copy"

