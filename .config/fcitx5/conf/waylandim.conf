# Detect current running application (Need restart)
DetectApplication=True
# Forward key event instead of commiting text if it is not handled
PreferKeyEvent=True
# since fcitx5 5.1.12, the virtual keyboard is torn down on every IM deactivate
# and rebuilt on activate (one flip per focus change) to clear stuck modifier
# state. upstream knows this pattern breaks things and shipped an escape hatch
# in the same release - commit 05f5f823 adds an option whose description
# literally cites sway compositors and "may make Gtk app choke" (sway issue
# #8143 — your crash class, referenced from the fcitx commit 45c024ab that
# temporarily reverted the churn). This setting makes the virtual keyboard a
# single long-lived object.
PersistentVirtualKeyboard=True
