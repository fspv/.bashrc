repos:
  - repo: https://github.com/JohnnyMorganz/StyLua
    rev: v2.4.0
    hooks:
      - id: stylua
        types: [lua]

  - repo: local
    hooks:
      - id: cargo-clippy
        name: cargo clippy (apps)
        language: system
        files: ^apps/
        pass_filenames: false
        entry: env NIX_ENFORCE_PURITY=0 cargo clippy --manifest-path apps/Cargo.toml --all-targets -- --deny warnings

      - id: cargo-test
        name: cargo test (apps)
        language: system
        files: ^apps/
        pass_filenames: false
        entry: env NIX_ENFORCE_PURITY=0 cargo test --manifest-path apps/Cargo.toml

      - id: act-actionlint
        name: act / actionlint.yml
        language: system
        pass_filenames: false
        always_run: true
        entry: .local/bin/act-staged -W .github/workflows/actionlint.yml

      - id: act-actions-security
        name: act / actions-security.yml
        language: system
        pass_filenames: false
        always_run: true
        entry: .local/bin/act-staged -W .github/workflows/actions-security.yml

      - id: act-dependency-audit
        name: act / dependency-audit.yml
        language: system
        pass_filenames: false
        always_run: true
        entry: .local/bin/act-staged -W .github/workflows/dependency-audit.yml

      - id: act-format-lint
        name: act / format-lint.yml
        language: system
        pass_filenames: false
        always_run: true
        entry: .local/bin/act-staged -W .github/workflows/format-lint.yml

      - id: act-lint
        name: act / lint.yml
        language: system
        pass_filenames: false
        always_run: true
        entry: .local/bin/act-staged -W .github/workflows/lint.yml

      - id: nix-develop
        name: nix develop
        language: system
        pass_filenames: false
        always_run: true
        entry: nix develop --ignore-environment --keep HOME --command echo "ok"

      - id: act-nvim-deprecations
        name: act / nvim-deprecations.yml
        language: system
        pass_filenames: false
        always_run: true
        entry: .local/bin/act-staged -W .github/workflows/nvim-deprecations.yml

      - id: act-nvim-plugins
        name: act / nvim-plugins.yml
        language: system
        pass_filenames: false
        always_run: true
        entry: .local/bin/act-staged -W .github/workflows/nvim-plugins.yml

      - id: act-python-lint
        name: act / python-lint.yml
        language: system
        pass_filenames: false
        always_run: true
        entry: .local/bin/act-staged -W .github/workflows/python-lint.yml

      - id: act-secret-scan
        name: act / secret-scan.yml
        language: system
        pass_filenames: false
        always_run: true
        entry: .local/bin/act-staged -W .github/workflows/secret-scan.yml

      - id: act-sway-config
        name: act / sway-config.yml
        language: system
        pass_filenames: false
        always_run: true
        entry: .local/bin/act-staged -W .github/workflows/sway-config.yml

      - id: act-systemd-lint
        name: act / systemd-lint.yml
        language: system
        pass_filenames: false
        always_run: true
        entry: .local/bin/act-staged -W .github/workflows/systemd-lint.yml
