repos:
  - repo: local
    hooks:
      - id: act-flake-lock
        name: act / flake-lock.yml
        language: system
        pass_filenames: false
        always_run: true
        entry: .local/share/bin/act-staged -W .github/workflows/flake-lock.yml

  - repo: https://github.com/JohnnyMorganz/StyLua
    rev: v2.5.2
    hooks:
      - id: stylua
        types: [lua]

  - repo: local
    hooks:
      - id: cargo-clippy
        name: cargo clippy (apps)
        language: system
        files: ^apps/
        pass_filenames: false
        entry: env NIX_ENFORCE_PURITY=0 cargo clippy --manifest-path apps/Cargo.toml --all-targets -- --deny warnings

      - id: cargo-test
        name: cargo test (apps)
        language: system
        files: ^apps/
        pass_filenames: false
        entry: env NIX_ENFORCE_PURITY=0 cargo test --manifest-path apps/Cargo.toml

      - id: act-dependency-audit
        name: act / dependency-audit.yml
        language: system
        pass_filenames: false
        always_run: true
        entry: .local/share/bin/act-staged -W .github/workflows/dependency-audit.yml

      - id: nix-develop
        name: nix develop
        language: system
        pass_filenames: false
        always_run: true
        entry: nix develop --no-write-lock-file --ignore-environment --keep HOME --command echo "ok"

      - id: nix-flake-check
        name: nix flake check
        language: system
        pass_filenames: false
        always_run: true
        entry: nix flake check --no-write-lock-file --print-build-logs --keep-going

      - id: nix-eval-checks
        name: nix eval checks (all systems)
        language: system
        pass_filenames: false
        always_run: true
        entry: "nix eval --no-write-lock-file --raw .#checks --apply 'checks: builtins.deepSeq (map (system: map (check: check.drvPath) (builtins.attrValues checks.${system})) [ \"x86_64-linux\" \"aarch64-linux\" \"aarch64-darwin\" ]) \"ok\"'"

      - id: nix-eval-dev-shells
        name: nix eval dev shells (all systems)
        language: system
        pass_filenames: false
        always_run: true
        entry: "nix eval --no-write-lock-file --raw .#devShells --apply 'shells: builtins.deepSeq (map (system: map (shell: shell.drvPath) (builtins.attrValues shells.${system})) [ \"x86_64-linux\" \"aarch64-linux\" \"aarch64-darwin\" ]) \"ok\"'"

      - id: gitleaks
        name: gitleaks
        language: system
        pass_filenames: false
        always_run: true
        entry: nix-shell --pure -p gitleaks git --run 'gitleaks git . --config .config/gitleaks/gitleaks.toml --redact --no-banner --log-opts=HEAD'

      - id: act-systemd-lint
        name: act / systemd-lint.yml
        language: system
        files: ^\.config/systemd/|^\.github/workflows/systemd-lint\.yml$
        pass_filenames: false
        entry: .local/share/bin/act-staged -W .github/workflows/systemd-lint.yml
