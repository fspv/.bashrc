name: ShellCheck

on:
  push:
    branches:
      - master
    paths:
      - '**/*.sh'
      - '**/*.bash'
      - '.config/zsh/**'
      - '.zshenv'
      - '.github/workflows/shellcheck.yml'
  pull_request:
    branches:
      - master
    paths:
      - '**/*.sh'
      - '**/*.bash'
      - '.config/zsh/**'
      - '.zshenv'
      - '.github/workflows/shellcheck.yml'

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run ShellCheck
        run: |
          git ls-files -z | xargs -0 file --mime-type | awk -F: '$2 ~ /text\/x-shellscript/ {print $1}' | grep -v '^\.config/zsh/' | xargs shellcheck

  zsh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Syntax check the files ShellCheck cannot parse
        run: git ls-files '.config/zsh/**' '.zshenv' | xargs -n1 zsh -n
