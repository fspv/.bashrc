name: Python Lint

on:
  push:
    branches:
      - master
    paths:
      - '**/*.py'
      - 'pyproject.toml'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - '.github/workflows/python-lint.yml'
  pull_request:
    branches:
      - master
    paths:
      - '**/*.py'
      - 'pyproject.toml'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - '.github/workflows/python-lint.yml'

permissions:
  contents: read

jobs:
  python-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
          update-environment: "${{ !env.ACT }}"

      - name: Install dependencies
        env:
          PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: |
          "$PYTHON" -m pip install --upgrade pip
          "$PYTHON" -m pip install -r requirements-dev.txt

      - name: Ruff format check
        if: always()
        env:
          PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: |
          "$PYTHON" -m ruff format --check .

      - name: Ruff lint
        if: always()
        env:
          PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: |
          "$PYTHON" -m ruff check .

      - name: Mypy strict
        if: always()
        env:
          PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: |
          "$PYTHON" -m mypy --strict .config/i3/scripts/window-binded-layout.py .config/sway/scripts/window-bound-layout.py .config/waybar/scripts/moon-phase.py .config/waybar/scripts/zodiac.py .config/sway/tests/test_sway_session.py
