name: Validate Sway Config

on:
  push:
    paths:
      - '**/.config/sway/config'
      - '**/.github/workflows/sway-config.yml'
  pull_request:
    paths:
      - '**/.config/sway/config'
      - '**/.github/workflows/sway-config.yml'

permissions:
  contents: read

jobs:
  validate-sway-config:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Sway
        run: |
          set -x
          sudo apt-get update
          sudo apt-get install -y sway

      - name: Validate Sway config
        env:
          WLR_BACKENDS: headless
          WLR_RENDERER: pixman
          WLR_LIBINPUT_NO_DEVICES: '1'
        run: |
          set -x
          XDG_RUNTIME_DIR=$(mktemp -d) sway --validate --config .config/sway/config
