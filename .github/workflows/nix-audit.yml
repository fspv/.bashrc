name: Nix Audit

# The flake is deliberately unlocked, so there is no manifest to diff against.
# Instead the dev shell is realised and its store closure is scanned, which
# reports whatever `nix develop` resolves to today.
on:
  schedule:
    - cron: '19 9 * * 5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vulnix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - name: Set up Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Init user env
        run: |
          ./.local/share/bin/init-nix.sh
          ./.local/share/bin/init-user-env.sh

      - name: Realise dev shell
        run: |
          nix develop --ignore-environment --keep HOME --profile /tmp/dev-shell --command true

      - name: Scan dev shell closure
        run: nix run nixpkgs#vulnix -- /tmp/dev-shell
