name: Nix Lint

on:
  push:
    branches:
      - master
    paths:
      - '**/*.nix'
      - '.github/workflows/nix-lint.yml'
  pull_request:
    branches:
      - master
    paths:
      - '**/*.nix'
      - '.github/workflows/nix-lint.yml'

permissions:
  contents: read

jobs:
  nix-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - name: Set up Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Run statix
        run: |
          nix run nixpkgs#statix -- check flake.nix
          nix run nixpkgs#statix -- check apps/flake.nix

      - name: Run deadnix, whose lambda check does not understand flake outputs
        run: nix run nixpkgs#deadnix -- --fail --no-lambda-pattern-names flake.nix apps/flake.nix
