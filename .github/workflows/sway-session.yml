name: Sway Session

on:
  push:
    paths:
      - '.config/sway/**'
      - '.config/systemd/user/**'
      - '.local/share/bin/sway-run'
      - 'tests/test_sway_session.py'
      - '.github/workflows/sway-session.yml'
  pull_request:
    paths:
      - '.config/sway/**'
      - '.config/systemd/user/**'
      - '.local/share/bin/sway-run'
      - 'tests/test_sway_session.py'
      - '.github/workflows/sway-session.yml'

jobs:
  test-sway-session:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The host profile confines unix_chkpwd inside the container too,
      # breaking PAM for user@.service. See apparmor="DENIED" in the container
      # journal when this is missing.
      - name: Unload host apparmor profile for unix_chkpwd
        run: sudo apparmor_parser -R /etc/apparmor.d/unix-chkpwd

      - name: Start desktop container
        run: >
          docker run --detach --tty --name desktop
          --privileged --cgroupns=private
          --env container=docker
          --volume "${PWD}:/repo:ro"
          nuhotetotniksvoboden/bootc-desktop-base:latest /sbin/init

      - name: Wait for systemd to finish booting
        run: |
          sleep 10
          docker exec desktop bash -c 'systemctl is-system-running --wait || systemctl list-units --failed --no-pager'

      - name: Install pytest
        run: docker exec desktop python3 -m pip install --quiet pytest

      - name: Run session tests
        run: docker exec desktop python3 -m pytest -v -p no:cacheprovider /repo/tests/test_sway_session.py

      - name: Show sway log
        if: failure()
        run: docker exec desktop cat /home/swaytest/sway.log

      - name: Show user units
        if: failure()
        run: docker exec desktop systemctl --user --machine swaytest@.host list-units --all --no-pager

      - name: Show system state
        if: failure()
        run: |
          docker exec desktop systemctl status user@30033.service --no-pager || true
          docker exec desktop loginctl --no-pager || true
          docker exec desktop bash -c 'journalctl --no-pager | tail -100' || true
