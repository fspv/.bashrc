[package]
name = "snapshot-store"
version.workspace = true
edition.workspace = true

[lib]
name = "snapshot_store"
path = "src/lib.rs"

[[bin]]
name = "snapshot-store"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
clap = { version = "4", features = ["derive"] }
common = { path = "../common" }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
