[package]
name = "snapshot-store"
version.workspace = true
edition.workspace = true
publish = false

[lib]
name = "snapshot_store"
path = "src/lib.rs"

[[bin]]
name = "snapshot-store"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
clap = { version = "4", features = ["derive"] }
common = { path = "../common" }
jiff = { version = "1", default-features = false, features = ["std", "serde"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
